<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #222; }
    .n { font-size: 13px; font-weight: bold; }
    .z { font-size: 11px; fill: #555; }
    .t { font-size: 13px; }
    .s { font-size: 11px; fill: #555; }
    .ln { stroke: #444; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#444"/>
    </marker>
  </defs>
  <rect width="760" height="420" fill="#fff"/>

  <text x="20" y="28" style="font-size:16px;font-weight:bold">Figure 2. ResNet-50 and the layers we extract features from</text>

  <!-- input image icon -->
  <rect x="30" y="120" width="90" height="90" fill="#eef3f8" stroke="#444" stroke-width="1.5"/>
  <circle cx="98" cy="140" r="9" fill="#f2c14e"/>
  <path d="M30 210 L62 160 L85 190 L98 175 L120 205 L120 210 Z" fill="#8aa985"/>
  <text x="75" y="232" class="n" text-anchor="middle">input image</text>
  <text x="75" y="247" class="z" text-anchor="middle">224×224×3</text>

  <!-- conv1 -->
  <rect x="150" y="90" width="40" height="150" fill="#e6e6e6" stroke="#444" stroke-width="1.5"/>
  <text x="170" y="258" class="n" text-anchor="middle">conv1</text>
  <text x="170" y="273" class="z" text-anchor="middle">+ pool</text>

  <!-- layer1 -->
  <rect x="225" y="90" width="55" height="150" fill="#1f77b4" fill-opacity="0.7" stroke="#444" stroke-width="1.5"/>
  <text x="252" y="258" class="n" text-anchor="middle">layer1</text>
  <text x="252" y="273" class="z" text-anchor="middle">56×56×256</text>

  <!-- layer2 -->
  <rect x="315" y="110" width="65" height="110" fill="#ff7f0e" fill-opacity="0.7" stroke="#444" stroke-width="1.5"/>
  <text x="347" y="258" class="n" text-anchor="middle">layer2</text>
  <text x="347" y="273" class="z" text-anchor="middle">28×28×512</text>

  <!-- layer3 -->
  <rect x="415" y="127" width="75" height="76" fill="#ff7f0e" fill-opacity="0.45" stroke="#444" stroke-width="1.5"/>
  <text x="452" y="258" class="n" text-anchor="middle">layer3</text>
  <text x="452" y="273" class="z" text-anchor="middle">14×14×1024</text>

  <!-- layer4 -->
  <rect x="525" y="142" width="85" height="46" fill="#2ca02c" fill-opacity="0.7" stroke="#444" stroke-width="1.5"/>
  <text x="567" y="258" class="n" text-anchor="middle">layer4</text>
  <text x="567" y="273" class="z" text-anchor="middle">7×7×2048</text>

  <!-- avgpool + fc -->
  <rect x="645" y="155" width="18" height="20" fill="#e6e6e6" stroke="#444" stroke-width="1.5"/>
  <text x="654" y="258" class="n" text-anchor="middle">pool</text>
  <text x="654" y="273" class="z" text-anchor="middle">2048</text>
  <rect x="700" y="130" width="18" height="70" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="709" y="258" class="n" text-anchor="middle" style="fill:#999">fc</text>
  <text x="709" y="273" class="z" text-anchor="middle" style="fill:#999">not used</text>

  <!-- forward arrows -->
  <line x1="122" y1="165" x2="146" y2="165" class="ln" marker-end="url(#a)"/>
  <line x1="192" y1="165" x2="221" y2="165" class="ln" marker-end="url(#a)"/>
  <line x1="282" y1="165" x2="311" y2="165" class="ln" marker-end="url(#a)"/>
  <line x1="382" y1="165" x2="411" y2="165" class="ln" marker-end="url(#a)"/>
  <line x1="492" y1="165" x2="521" y2="165" class="ln" marker-end="url(#a)"/>
  <line x1="612" y1="165" x2="641" y2="165" class="ln" marker-end="url(#a)"/>
  <line x1="665" y1="165" x2="696" y2="165" class="ln" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- feature taps -->
  <line x1="252" y1="282" x2="252" y2="305" class="ln" marker-end="url(#a)"/>
  <text x="252" y="322" class="t" text-anchor="middle">early features</text>
  <text x="252" y="338" class="t" text-anchor="middle" style="font-weight:bold;fill:#1f77b4">→ EVC</text>

  <path d="M347 282 L347 292 L452 292 L452 282 M400 292 L400 305" class="ln"/>
  <line x1="400" y1="300" x2="400" y2="306" class="ln" marker-end="url(#a)"/>
  <text x="400" y="322" class="t" text-anchor="middle">middle features</text>
  <text x="400" y="338" class="t" text-anchor="middle" style="font-weight:bold;fill:#d35f00">→ LOC</text>

  <line x1="567" y1="282" x2="567" y2="305" class="ln" marker-end="url(#a)"/>
  <text x="567" y="322" class="t" text-anchor="middle">deep features</text>
  <text x="567" y="338" class="t" text-anchor="middle" style="font-weight:bold;fill:#2ca02c">→ PPA, OPA, RSC</text>

  <text x="30" y="372" class="t">Each set of features → ridge regression → predicted response in that ROI → Bayesian identification</text>

  <text x="30" y="402" class="s">ResNet-50 pretrained on ImageNet. Boxes not to scale. Sizes: height × width × channels (224×224 input).</text>
</svg>
