<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 350" width="1190" height="350" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #222; }
    .h { font-size: 13px; font-weight: bold; }
    .t { font-size: 13px; }
    .s { font-size: 11px; fill: #555; }
    .roi { font-size: 15px; font-weight: bold; }
    .brain { fill: #e6e6e6; stroke: #555; stroke-width: 2; }
    .cb { fill: #d6d6d6; stroke: #555; stroke-width: 1.8; }
    .sul { fill: none; stroke: #aaa; stroke-width: 1.8; stroke-linecap: round; }
  </style>
  <rect width="1190" height="350" fill="#fff"/>

  <text x="20" y="28" style="font-size:16px;font-weight:bold">Figure 1. ResNet layers and the visual ROIs we expect them to predict best</text>

  <!-- A: table -->
  <text x="20" y="66" style="font-size:16px;font-weight:bold">A</text>
  <line x1="40" y1="78" x2="495" y2="78" stroke="#222" stroke-width="1.5"/>
  <text x="44" y="97" class="h">Layer</text>
  <text x="185" y="97" class="h">What it picks up</text>
  <text x="365" y="97" class="h">Expected ROI</text>
  <line x1="40" y1="106" x2="495" y2="106" stroke="#222" stroke-width="0.8"/>

  <rect x="44" y="119" width="11" height="11" fill="#1f77b4"/>
  <text x="62" y="129" class="t">Early (layer1)</text>
  <text x="185" y="129" class="t">edges, color, simple patterns</text>
  <text x="365" y="129" class="t">EVC (V1–V3)</text>

  <rect x="44" y="151" width="11" height="11" fill="#ff7f0e"/>
  <text x="62" y="161" class="t">Middle (layer2/3)</text>
  <text x="185" y="161" class="t">shapes, textures</text>
  <text x="365" y="161" class="t">LOC</text>

  <rect x="44" y="183" width="11" height="11" fill="#2ca02c"/>
  <text x="62" y="193" class="t">Deep (layer4)</text>
  <text x="185" y="193" class="t">whole objects, scenes</text>
  <text x="365" y="193" class="t">PPA, OPA, RSC</text>
  <line x1="40" y1="206" x2="495" y2="206" stroke="#222" stroke-width="1.5"/>

  <text x="40" y="236" class="s">EVC = early visual cortex, LOC = lateral occipital complex,</text>
  <text x="40" y="252" class="s">OPA = occipital place area, PPA = parahippocampal place area,</text>
  <text x="40" y="268" class="s">RSC = retrosplenial cortex.</text>
  <text x="40" y="296" class="s">ROI locations in B are approximate (hand-drawn schematic, not real data).</text>
  <text x="40" y="312" class="s">Data: BOLD5000 (Chang et al., 2019).</text>

  <!-- B -->
  <text x="520" y="66" style="font-size:16px;font-weight:bold">B</text>

  <!-- lateral -->
  <g transform="translate(530,55) scale(0.85) translate(-570,-110)">
    <path d="M 790 315 C 795 340, 798 360, 802 380" fill="none" stroke="#999" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="845" cy="322" rx="42" ry="23" class="cb"/>
    <path class="brain" d="M 580 260 C 570 200, 610 140, 690 125 C 770 110, 850 135, 885 190 C 905 225, 908 265, 893 292 C 873 312, 840 312, 815 305 C 790 330, 740 340, 700 330 C 660 320, 640 302, 610 300 C 585 298, 578 280, 580 260 Z"/>
    <path class="sul" d="M 640 272 C 690 258, 740 256, 792 246"/>
    <path class="sul" d="M 742 124 C 732 165, 724 200, 718 242"/>
    <path class="sul" d="M 680 300 C 710 292, 745 292, 775 285"/>
    <path d="M 872 205 C 892 215, 908 250, 900 285 C 893 296, 880 300, 868 294 C 860 265, 860 230, 872 205 Z" fill="#1f77b4" fill-opacity="0.7"/>
    <ellipse cx="832" cy="276" rx="23" ry="16" fill="#ff7f0e" fill-opacity="0.75"/>
    <ellipse cx="842" cy="212" rx="18" ry="13" fill="#2ca02c" fill-opacity="0.75"/>
    <text x="914" y="255" class="roi" fill="#1f77b4">EVC</text>
    <text x="804" y="281" class="roi" text-anchor="end">LOC</text>
    <text x="819" y="217" class="roi" text-anchor="end">OPA</text>
    <text x="735" y="408" class="t" text-anchor="middle" style="font-size:15px">lateral</text>
  </g>

  <!-- medial -->
  <g transform="translate(868,55) scale(0.85) translate(-570,-410)">
    <path d="M 770 590 C 778 620, 785 650, 790 680" fill="none" stroke="#999" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="845" cy="622" rx="42" ry="23" class="cb"/>
    <path class="brain" d="M 580 560 C 570 500, 610 440, 690 425 C 770 410, 850 435, 885 490 C 905 525, 908 565, 893 592 C 873 612, 840 612, 815 605 C 790 630, 740 640, 700 630 C 660 620, 640 602, 610 600 C 585 598, 578 580, 580 560 Z"/>
    <path d="M 660 520 C 690 488, 760 483, 800 508 C 812 518, 808 536, 792 533 C 762 512, 702 512, 672 532 C 660 540, 650 530, 660 520 Z" fill="#d0d0d0" stroke="#777" stroke-width="1.5"/>
    <path class="sul" d="M 902 562 C 872 556, 846 557, 818 568"/>
    <path class="sul" d="M 860 470 C 850 500, 838 525, 825 552"/>
    <path d="M 845 528 C 875 528, 905 545, 902 582 C 892 597, 865 600, 845 592 C 832 575, 832 545, 845 528 Z" fill="#1f77b4" fill-opacity="0.7"/>
    <ellipse cx="814" cy="540" rx="13" ry="18" fill="#2ca02c" fill-opacity="0.75"/>
    <ellipse cx="752" cy="618" rx="34" ry="10" fill="#2ca02c" fill-opacity="0.75"/>
    <text x="912" y="572" class="roi" fill="#1f77b4">EVC</text>
    <text x="797" y="556" class="roi" text-anchor="end">RSC</text>
    <text x="745" y="655" class="roi" text-anchor="middle">PPA</text>
    <text x="735" y="708" class="t" text-anchor="middle" style="font-size:15px">medial</text>
  </g>
</svg>
